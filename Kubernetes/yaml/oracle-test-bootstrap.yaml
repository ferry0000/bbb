apiVersion: v1
kind: Pod
metadata:
  name: oracle-test-bootstrap
spec:
  containers:
    - name: oracle-test-bootstrap
      image: container-registry.oracle.com/database/free:latest
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      command: ["/bin/sh", "/opt/bootstrap/bootstrap.sh"]
      ports:
        - containerPort: 1521
        - containerPort: 5500
      env:
        - name: ORACLE_PWD
          value: "Oracle123"
      volumeMounts:
        - name: bootstrap
          mountPath: /opt/bootstrap
          readOnly: true
  volumes:
    - name: bootstrap
      configMap:
        name: oracle-bootstrap
        defaultMode: 0755