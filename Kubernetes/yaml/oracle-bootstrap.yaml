apiVersion: v1
kind: ConfigMap
metadata:
  name: oracle-bootstrap
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eux

    echo "[bootstrap] running as: $(id)"

    # GID=1300 のグループ作成
    groupadd -g 1300 scc
    
    # UID=12345 のユーザ作成
    useradd -u 12345 -g 1300 sccuser
    
    # oracleユーザをsccグループに追加
    usermod -aG 1300 oracle
    
    # ディレクトリ作成・所有者・権限設定
    mkdir -p /aaa/bbb/ccc
    chown -R 12345:1300 /aaa/bbb/ccc
    chmod 755 /aaa/bbb/ccc

    echo "[bootstrap] switch to oracle user and start DB"

    exec su oracle -c "/opt/oracle/runOracle.sh"